name: PCM Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Versión del release (ej. v1.3.0)"
        required: true
        default: "v1.3.0"

permissions:
  contents: write

jobs:
  test-and-release:
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run minimal tests
        run: |
          python -m compileall -q architecture_base_cpwg.py rf_discontinuity_analyzer.py generate_icons.py
          python -m unittest discover -s tests -v

      - name: Validate PCM metadata
        env:
          RELEASE_VERSION: ${{ github.event.inputs.tag_name || github.ref_name }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          metadata = json.loads(Path("metadata.json").read_text(encoding="utf-8"))
          required = {
              "name", "description", "description_full", "identifier", "type",
              "author", "license", "resources", "versions",
          }
          missing = required - metadata.keys()
          if missing:
              raise SystemExit(f"metadata.json is missing required fields: {sorted(missing)}")
          if metadata["$schema"] != "https://go.kicad.org/pcm/schemas/v1":
              raise SystemExit("metadata.json must use the official KiCad PCM v1 schema")
          if metadata["type"] != "plugin" or not metadata["versions"]:
              raise SystemExit("metadata.json must describe a plugin with at least one version")
          release_tag = os.environ["RELEASE_VERSION"]
          if not re.fullmatch(r"v\d{1,4}(?:\.\d{1,4}(?:\.\d{1,6})?)?", release_tag):
              raise SystemExit(f"release tag {release_tag!r} is not a PCM numeric version")
          version = release_tag[1:]
          if metadata["versions"][0]["version"] != version:
              raise SystemExit(
                  f"tag version {version} does not match metadata.json version "
                  f"{metadata['versions'][0]['version']}"
              )
          print(f"Validated metadata.json for version {version}")
          PY

      - name: Generate package icon
        run: python generate_icons.py --output-dir resources

      - name: Package PCM plugin
        run: |
          mkdir -p package/resources
          cp architecture_base_cpwg.py rf_discontinuity_analyzer.py README.md package/
          cp resources/icon.svg package/resources/
          (
            cd package
            zip -qr ../arquitectura_base_cpwg_pcm.zip .
          )

      - name: Add release download details to metadata
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag_name || github.ref_name }}
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          archive = Path("arquitectura_base_cpwg_pcm.zip")
          metadata_path = Path("metadata.json")
          metadata = json.loads(metadata_path.read_text(encoding="utf-8"))
          version = os.environ["RELEASE_TAG"].removeprefix("v")
          package_version = next(
              item for item in metadata["versions"] if item["version"] == version
          )
          package_version.update(
              download_url=(
                  "https://github.com/estjuridicomadrid-dev/arquitectura-base-CPWG/"
                  f"releases/download/{os.environ['RELEASE_TAG']}/{archive.name}"
              ),
              download_sha256=hashlib.sha256(archive.read_bytes()).hexdigest(),
              download_size=archive.stat().st_size,
          )
          metadata_path.write_text(
              json.dumps(metadata, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Validate release metadata
        run: |
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          metadata = json.loads(Path("metadata.json").read_text(encoding="utf-8"))
          version = metadata["versions"][0]
          if not re.fullmatch(r"https://\S+", version.get("download_url", "")):
              raise SystemExit("release metadata must contain a valid HTTPS download_url")
          if not re.fullmatch(r"[a-f0-9]{64}", version.get("download_sha256", "")):
              raise SystemExit("release metadata must contain a lowercase SHA-256 hash")
          if version.get("download_size", 0) <= 0:
              raise SystemExit("release metadata must contain a positive download_size")
          print("Validated release URL, SHA-256, and archive size")
          PY

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          target_commitish: main
          generate_release_notes: true
          files: |
            arquitectura_base_cpwg_pcm.zip
            metadata.json
